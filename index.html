<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BK21 실적 입력</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — top bar with role switch, left category rail + record list; stacks to one column on phones */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#EEF1F5; --line:#D9DEE6;
  --ink:#1D2532; --mute:#5C6676; --navy:#1F3A5F; --navy-soft:#E6ECF4;
  --accent:#C9601F; --accent-soft:#FBEADF; --em:#A3440F;
  --ok:#2E7D5B; --ok-soft:#E1F2E9; --warn:#B23B3B; --warn-soft:#F8E3E3;
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --surface:#1A222E; --sunk:#151C26; --line:#2C3747;
  --ink:#E4E9F0; --mute:#9AA6B6; --navy:#8FB3E0; --navy-soft:#22324A;
  --accent:#F08A4B; --accent-soft:#3A2618; --em:#F5A06B;
  --ok:#6CC59A; --ok-soft:#1C3328; --warn:#F08A8A; --warn-soft:#3A2020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1A222E; --sunk:#151C26; --line:#2C3747;
  --ink:#E4E9F0; --mute:#9AA6B6; --navy:#8FB3E0; --navy-soft:#22324A;
  --accent:#F08A4B; --accent-soft:#3A2618; --em:#F5A06B;
  --ok:#6CC59A; --ok-soft:#1C3328; --warn:#F08A8A; --warn-soft:#3A2020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:20px;margin:0;color:var(--navy);letter-spacing:-.01em}
.brand small{color:var(--mute)}
.demo{font-size:12px;font-weight:600;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:999px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--mute);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.who select{width:auto}
textarea{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--mute);padding:6px 8px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
nav.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
nav.cats button{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
nav.cats button:hover{background:var(--sunk)}
nav.cats button[aria-current="true"]{background:var(--navy-soft);color:var(--navy);font-weight:600}
nav.cats button.promo-nav{margin-top:10px;border-top:1px dashed var(--line);border-radius:0 0 8px 8px;color:var(--mute)}
.promo .bar-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 6px;font-size:14px}
.promo .prog i.warn{background:var(--accent)}
.promo .verdict{margin-top:16px;padding:14px;border-radius:8px;background:var(--sunk);font-weight:600}
.promo .verdict.ok{background:var(--ok-soft);color:var(--ok)}
.promo td.num,.promo th.num{text-align:right;font-variant-numeric:tabular-nums}
.promo tr.zero td{color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);justify-self:center}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.fix{background:var(--warn);border-color:var(--warn)}
.count{font-family:var(--mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;justify-content:space-between;margin-bottom:14px}
.head h2{margin:0;font-size:20px;text-wrap:balance}
.rule{background:var(--sunk);border-radius:8px;padding:10px 14px;color:var(--mute);font-size:13.5px;margin-bottom:16px}
.rule{border-left:4px solid var(--em)}
.rule b{color:var(--em);font-weight:700}
details.ex{margin-bottom:14px}
details.ex summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:14px;padding:4px 0}
.item.ex{border-style:dashed;background:var(--sunk);margin-top:8px}
.files{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--mute)}
.files a{color:var(--navy);word-break:break-all}
.files .btn{padding:0 6px}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.item.fix{border-color:var(--warn);background:var(--warn-soft)}
.item .t{font-weight:600}
.item .meta{color:var(--mute);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.item .meta .mono{font-family:var(--mono);font-size:12.5px}
.item .acts{display:flex;gap:4px;align-items:flex-start}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--mute)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.fix{background:var(--warn-soft);color:var(--warn)}
.chip.rep{background:var(--accent-soft);color:var(--accent)}
.chip.pre{background:var(--navy-soft);color:var(--navy)}
.review{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.review input{flex:1 1 220px;width:auto}
.note{grid-column:1/-1;font-size:13.5px;color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--mute)}
form.edit{border:2px solid var(--navy);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-bottom:12px}
form.edit .full{grid-column:1/-1}
form.edit label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:500}
form.edit label .req{color:var(--accent)}
form.edit .row{display:flex;gap:8px}
form.edit .row input{flex:1}
form.edit .help{font-size:12.5px;color:var(--mute)}
form.edit .ctr{font-family:var(--mono);font-size:12px;text-align:right;color:var(--mute)}
form.edit .ctr.over{color:var(--warn)}
form.edit .checks{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink);font-weight:400}
form.edit .checks label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-weight:400;font-size:14px}
form.edit .checks input{width:auto}
form.edit .bar{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{font-size:13px;color:var(--mute)}
.years{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.years label{font-family:var(--mono);font-size:12px}
@media (max-width:820px){.years{grid-template-columns:repeat(3,minmax(0,1fr))}}
.msg.err{color:var(--warn)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.welcome{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:20px}
.welcome .panel h2{margin:0 0 6px;font-size:22px;text-wrap:balance}
.steps{margin:10px 0 0;padding-left:20px;color:var(--ink)}
.steps li{margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:500}
.prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.pcard:hover{border-color:var(--navy)}
.pcard .n{font-weight:600;font-size:16px}
.pcard .s{display:flex;gap:6px;flex-wrap:wrap}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--sunk);color:var(--mute);font-weight:600;font-size:13px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.back{margin-bottom:12px}
.export{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.export select{width:auto}
textarea.tsv{font-family:var(--mono);font-size:12px;min-height:120px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:10}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.cats{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.cats button{grid-template-columns:14px auto auto;white-space:nowrap}
  .welcome{grid-template-columns:1fr}
  form.edit{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.login{max-width:560px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0;font-size:22px;color:var(--navy)}
.loginrow{display:flex;gap:8px;flex-wrap:wrap}
.loginrow input{flex:1 1 240px;width:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--mono);font-size:13px}
.who .mono{color:var(--mute)}
</style>
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>

<script>
/* ===== 조사 항목 정의 ===== */
const FIELD_OPTS = {
  role: ['1저자','교신','공저자'],
  gtype: ['정부 (지자체 포함)','산업체 (국내)','해외기관'],

  socfields: ['정책 기여','거버넌스 구축','미래/글로벌 대응','기업현안 해결','인력 재교육','기타'],
  intlkind: ['국제학회 수상','초청강연','기조연설','좌장','위원회','국제학술지 편집위원','국제 저술'],

  degree: ['학부연구생','학·석 연계과정','석사','박사','석박통합','박사후연구원'],
  status: ['재학','수료','졸업','휴학','학부 재학','계약 중','계약 종료'],

  dept: ['의과학과 대학원','타 학과 대학원'],
  toptype: ['논문','특허','저서','기술이전','기타'],
};
const YEARS = Array.from({length:Math.max(2026,new Date().getFullYear())-2020},(_,k)=>String(2021+k));
const CATS = [
  {key:'roster', name:'지도학생 및 연구원 명단', table:'첨부 2·3·4 · 2-2', rule:'<b>논문보다 먼저 입력해 주세요</b> — 논문 탭의 지도학생 주저자를 이 명단에서 고릅니다. 4단계 BK 참여학생은 미리 채워 두었으니 <b>졸업생 진로 확인</b>과 <b>박사후연구원·학부연구생 추가</b>부터 해 주세요.<br><b>2021년 이후</b> 지도한 학생 전원 (재학·수료·졸업), 박사후연구원, 그리고 연구실의 <b>학부연구생·학석 연계과정생</b> (5단계는 학·석·박 연계를 봅니다). <b>4단계 BK 참여학생 명단(2020.2–2026.2학기)</b>으로 미리 채웠으니 지금 명단에 없는 학생(졸업생의 <b>졸업 연월·진로</b>, 상태)을 고쳐 주시고, BK에 참여하지 않은 대학원생과 <b>박사후연구원·학부연구생</b>은 <b>+ 추가</b>로 넣어 주세요. 학생 수가 장학금 규모와 참여교수 결정의 기준이 됩니다. <b>BK 참여 여부와 관계없이 모두 넣고</b>, 지금 BK 참여 중인지만 따로 표시해 주세요 (26.2학기 BK 참여 중인 학생은 \'예\'로 되어 있어요).',
   fields:[
    {k:'name',l:'이름',t:'text',req:1},
    {k:'sid',l:'학번',t:'text'},
    {k:'degree',l:'과정',t:'select',o:'degree',req:1},
    {k:'status',l:'상태',t:'select',o:'status',req:1},
    {k:'bk',l:'BK 참여 (현재)',t:'yn'},
    {k:'admit',l:'입학·임용 연월',t:'text',ph:'2023.03'},
    {k:'grad',l:'졸업 연월',t:'text',ph:'2026.02'},
    {k:'foreign',l:'외국인',t:'yn'},
    {k:'ckind',l:'졸업 후 진로',t:'select',o:'career'},
    {k:'career',l:'진로 기관 · 직위',t:'text',full:1,ph:'한국뇌연구원 연수연구원'},
   ], title:f=>f.name+(f.sid?' · '+f.sid:''), meta:f=>[f.degree, f.status, f.admit&&('입학 '+f.admit), f.grad&&('졸업 '+f.grad), f.career], chips:f=>[f.bk==='예'&&['rep','BK 참여'], f.foreign==='예'&&['pre','외국인'], f.status==='졸업'&&!f.ckind&&['fix','진로 미입력']]},
  {key:'paper', name:'논문', table:'3-2 · 3-3', rule:'<b>2021.1 이후</b> 게재된 SCI(E)·SSCI·A&HCI·등재(후보)·Scopus 논문 전체 (경북대 소속 표기, 권·호·쪽이 있는 논문). DOI만 넣고 <b>자동 채우기</b>를 누르세요. <b>IF와 JCR 상위 %를 S2Journal·JCR에서 확인해 넣어 주세요</b> (참고 칸의 IF는 중간평가 1차조사 값, 2025년 기준) (출판 당시: 7–12월 출판은 전년도, 1–6월 출판은 전전년도 JCR). 신청서는 <b>대표업적 1인당 3건</b>(정성 70%)과 <b>전체 논문</b>(정량 30%)을 함께 봅니다.',
   fields:[
    {k:'doi',l:'DOI',t:'doi',req:1,full:1},
    {k:'title',l:'논문 제목',t:'text',req:1,full:1},
    {k:'journal',l:'학술지',t:'text',req:1},
    {k:'ym',l:'게재연월',t:'text',ph:'2025.07',req:1},
    {k:'vol',l:'권(호)',t:'text',ph:'16(1)'},
    {k:'pages',l:'쪽',t:'text',ph:'201-230'},

const ROLE_OLD={'제1저자':'1저자','교신저자':'교신','기타저자':'공저자','1저자(공동)':'1저자','교신(공동)':'교신'};

const docOf=d=>{const x=Object.assign({id:d.id},d.data());if(x.cat==='paper'&&x.f&&ROLE_OLD[x.f.role])x.f.role=ROLE_OLD[x.f.role];if(x.cat==='roster'&&x.pre&&x.f&&x.f.bk===undefined)x.f.bk='예';return x};
async function loadCommon(){
  const [rv,cfg]=await Promise.all([db.collection('reviewers').get(),db.doc('config/app').get()]);
  S.data.reviewers=rv.docs.map(docOf).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  if(cfg.exists){const c=cfg.data();S.data.deadline=c.deadline||'추후 공지';S.data.uploadUrl=c.uploadUrl||'';S.data.jcrYears=c.jcrYears||[];S.data.jcrBase=c.jcrBase||''}
}
function putProf(p){const i=S.data.profs.findIndex(x=>x.id===p.id);if(i>=0)S.data.profs[i]=p;else S.data.profs.push(p);S.data.profs.sort((a,b)=>a.name.localeCompare(b.name,'ko'))}
function putItems(pid,list){S.data.items=S.data.items.filter(i=>i.prof!==pid).concat(list)}
async function loadProf(pid){
  const [p,it]=await Promise.all([db.doc('profs/'+pid).get(),db.collection('items').where('prof','==',pid).get()]);
  if(p.exists) putProf(docOf(p)); putItems(pid,it.docs.map(docOf));
}
async function loadReviewer(rid){
  const r=S.data.reviewers.find(x=>x.id===rid); if(!r) return;
  const q=db.collection('profs').where('rev','==',rid);
  const ps=(await q.get()).docs.map(docOf); ps.forEach(putProf);
  await Promise.all(ps.map(p=>db.collection('items').where('prof','==',p.id).get().then(s=>putItems(p.id,s.docs.map(docOf)))));
}
async function loadAll(){
  const [ps,it]=await Promise.all([db.collection('profs').get(),db.collection('items').get()]);
  S.data.profs=[];ps.docs.map(docOf).forEach(putProf);S.data.items=it.docs.map(docOf);
}
async function refresh(){
  S.busy=true;render();
  try{
    await loadCommon();
    if(S.role==='admin') await loadAll();
    else if(S.role==='rev'){ if(S.open) await loadProf(S.open); else await loadReviewer(S.me.rev); }
    else if(S.role==='prof') await loadProf(S.me.prof);
  }catch(e){console.error(e);toast('자료를 불러오지 못했어요')}
  S.busy=false;render();
}

  try{
    const kd=await db.doc('keys/'+S.key).get(); const d=kd.exists?kd.data():{};
    S.name=d.name||'';
    if(d.prof){S.roles.push('prof');S.me.prof=d.prof}
    if(d.rev){S.roles.push('rev');S.me.rev=d.rev}
    const adm=await db.collection('keys').limit(1).get().then(()=>true).catch(()=>false);
    if(adm){S.roles.push('admin');if(!S.name)S.name='관리자'}
  }catch(e){console.error(e)}

  await refresh();
}

      <dt>지도학생</dt><dd>${itemsOf(p.id,'roster').filter(i=>['재학','수료'].includes(i.f.status)&&!['박사후연구원','학부연구생','학·석 연계과정'].includes(i.f.degree)).length}명 (재학·수료 대학원생)</dd>
      <dt>담당 교수</dt><dd>${p.rev&&revName(p.rev)===p.name?'본인':esc(revName(p.rev))}</dd>
      <dt>확인 완료</dt><dd>${st.done} / ${CATS.length} 항목</dd>
    </dl><div class="prog" style="margin-top:12px"><i style="width:${st.done/CATS.length*100}%"></i></div>
    ${mode==='prof'?`<p class="msg" style="margin-top:10px">직급은 위에서 직접 고칠 수 있어요. 연구자등록번호가 틀리면 담당 교수께 알려 주세요.</p>`:''}</div>
  </div>
  <div class="panel"><div class="head"><h2 style="font-size:17px">수정 요청 ${fixes.length}건</h2></div>
    ${fixes.length?`<div class="items">${fixes.map(i=>`<div class="item fix"><div><div class="t">${esc(CAT[i.cat].title(i.f))}</div><div class="meta"><span>${CAT[i.cat].name}</span></div></div><div class="acts"><button class="btn sm" data-goto="${i.cat}">열기</button></div><div class="note">의견: ${esc(i.rv.c)}</div></div>`).join('')}</div>`
      :`<div class="empty">수정 요청이 없습니다.</div>`}
  </div>`;
}

/* ===== 승진 실적 (조교수·부교수 본인과 관리자에게만 보임, 담당 교수 화면에는 없음) ===== */
const RANKS=['교수','부교수','조교수','기금교수(교수대우)','기금교수(부교수대우)','기금교수(조교수대우)'];
const PROMO_NEXT={'조교수':'부교수','부교수':'교수'};
const promoOK=(p,mode)=>mode!=='rev'&&!!PROMO_NEXT[p.rank];
function promoCrit(type,target){ // 논문 총 편수 / JCR 상위 50% 이내 편수
  if(target==='부교수') return type==='기초'?{total:5,if50:2}:type==='임상'?{total:3,if50:1}:null;
  return type==='기초'?{total:6,if50:3}:type==='임상'?{total:4,if50:1}:null;
}
const PROMO_MAIN=['1저자','교신','공동 제1·교신','주저자 (제1/교신 미구분)'];
function promoPaper(i){const f=i.f,main=PROMO_MAIN.includes(f.role),nm=parseInt(f.nmain),n=Math.max(1,nm||1),j=parseFloat(f.jcr),hasJ=!isNaN(j),base=main?1/n:0;
  return {i,f,main,n,noN:main&&!nm,j:hasJ?j:null,eff:base*(hasJ&&j<=5?2:1),eff50:hasJ&&j<=50?base:0}}
S.promoFrom={};
function promoFrom(pid){if(pid in S.promoFrom)return S.promoFrom[pid];try{return localStorage.getItem('promoFrom:'+pid)||''}catch(e){return ''}}
function promoPanel(p){
  const target=PROMO_NEXT[p.rank], crit=promoCrit(p.type,target), from=promoFrom(p.id), fYM=ymOf(from);
  const head=`<div class="head"><h2 style="font-size:17px">승진 실적 달성도 · ${esc(p.type)} · ${esc(p.rank)} → ${target}</h2></div>
    <p class="msg">교수님 본인과 BK 사무국만 보는 참고용 화면입니다 (담당 교수 화면에는 나오지 않아요). 이 조사에 입력한 <b>2021년 이후 논문</b>만으로 계산하므로, 실제 승진 심사는 교무 규정과 통합정보시스템 기준으로 다시 확인해 주세요.</p>
    <p style="margin:12px 0 0"><label for="promo-from" class="msg">산정 시작 연월 </label><input type="month" id="promo-from" value="${esc(from)}" style="max-width:170px">
    <span class="msg">현 직급 임용 이후 논문만 세려면 넣어 주세요. 이 브라우저에만 저장돼요.</span></p>`;
  if(!crit) return `<div class="panel promo">${head}<p class="msg" style="margin-top:14px">이 계열은 국내논문이 포함된 기준이라 자동 계산하지 않습니다.</p></div>`;
  const P=itemsOf(p.id,'paper').filter(i=>!fYM||ymOf(i.f.ym)>=fYM).sort((a,b)=>dkey(b)-dkey(a)).map(promoPaper);
  const tot=P.reduce((s,x)=>s+x.eff,0), t50=P.reduce((s,x)=>s+x.eff50,0);
  const waived=tot>=crit.total*1.5, totOK=tot>=crit.total, ok50=t50>=crit.if50||waived, all=totOK&&ok50;
  const bar=(label,v,need,ok,tag)=>`<div class="bar-row"><span>${label} <span class="mono">${v.toFixed(2)} / ${need}</span></span><span class="chip ${ok?'ok':'fix'}">${tag||(ok?'충족':'미달')}</span></div>
    <div class="prog"><i class="${ok?'':'warn'}" style="width:${Math.min(100,v/need*100)}%"></i></div>`;
  const lack=[!totOK&&`논문 ${(crit.total-tot).toFixed(2)}편`, !ok50&&`JCR 상위 50% 이내 ${(crit.if50-t50).toFixed(2)}편`].filter(Boolean).join(' + ');
  const rows=P.map(x=>`<tr class="${x.eff?'':'zero'}"><td>${esc(x.f.journal||'—')}<div class="msg" style="font-size:12px">${esc(String(x.f.title||'').slice(0,80))}</div>
      ${x.noN?'<span class="chip fix">주저자 수 미입력 → 1명으로 계산</span> ':''}${x.main&&x.j===null?'<span class="chip fix">JCR 미입력</span>':''}</td>
    <td>${esc(x.f.ym||'')}</td><td>${esc(x.f.role||'—')}${x.main&&x.n>1?` (1/${x.n})`:''}</td>
    <td class="num">${x.j===null?'—':x.j}${x.j!==null&&x.j<=5?' <span class="chip pre">×2</span>':''}</td>
    <td class="num">${x.eff.toFixed(2)}</td><td class="num">${x.eff50?'✓':'—'}</td></tr>`).join('');
  return `<div class="panel promo">${head}
    ${bar('국제논문 환산 편수',tot,crit.total,totOK)}
    ${bar('JCR 상위 50% 이내',t50,crit.if50,ok50,waived?'면제':'')}
    ${waived?`<p class="msg" style="margin-top:6px">총 편수가 기준의 1.5배(${(crit.total*1.5).toFixed(1)}편) 이상이라 JCR 50% 기준이 면제될 수 있어요.</p>`:''}
    <div class="verdict ${all?'ok':''}">${all?'논문 요건 충족':'부족: '+lack}</div>
  </div>
  <div class="panel promo" style="margin-top:16px"><div class="head"><h2 style="font-size:17px">논문별 환산 (${P.length}편)</h2></div>
    ${P.length?`<div class="tablebox"><table><thead><tr><th>학술지 / 제목</th><th>게재</th><th>저자 역할</th><th class="num">JCR 상위 %</th><th class="num">환산</th><th class="num">≤50%</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">해당 기간의 논문이 없습니다.</div>'}
    <p class="msg" style="margin-top:12px">환산 규칙: 제1·교신(주)저자 논문만 셈 · 주저자가 n명이면 1/n편 · JCR 상위 5% 이내는 2편 · 공저자는 0편. 증례보고(0.5편)는 이 조사에서 구분하지 않아 원저로 계산됩니다.</p>
  </div>`;
}

function intlAuto(pid){
  return itemsOf(pid).filter(i=>(i.cat==='paper'||i.cat==='ip')&&i.f.intl==='예').map(i=>{const f=i.f;
    const out=i.cat==='paper'?[f.title,f.journal&&(f.journal+(f.ym?' ('+f.ym+')':'')),f.vol,f.pages,f.doi&&('DOI '+f.doi)].filter(Boolean).join('. ')
      :[f.kind,f.title,f.country,f.number].filter(Boolean).join(' · ');
    return {src:i.cat==='paper'?'논문':'특허 등',output:out,partner:f.partner||'',inst:f.pinst||'',year:String(i.cat==='paper'?f.ym||'':f.date||'').slice(0,4)}})}
function catPanel(p,c,mode){
  let it=itemsOf(p.id,c.key).slice().sort((a,b)=>dkey(b)-dkey(a));
  if(mode!=='prof'&&S.filterFix) it=it.filter(i=>i.rv.s!=='ok');
  const canEdit=mode!=='rev', editingNew=S.editing==='new', done=(p.done||{})[c.key];
  return `<div class="panel">
    <div class="head"><div><h2>${c.name}</h2><span class="msg">신청서 ${esc(c.table)}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${mode!=='prof'?`<label class="btn sm" style="cursor:pointer"><input type="checkbox" id="flt" ${S.filterFix?'checked':''} style="width:auto"> 미확인만</label>`:''}
        ${canEdit&&!editingNew?`<button class="btn primary" data-act="add">+ 추가</button>`:''}
      </div></div>
    <div class="rule">${c.rule}</div>
    ${EX[c.key]&&mode!=='rev'?`<details class="ex" ${it.length?'':'open'}><summary>작성 예시 보기 (${EX[c.key].length}가지)</summary>${exHTML(c)}</details>`:''}
    ${c.key==='collab'?(()=>{const A=intlAuto(p.id);return `<div class="items" style="margin-bottom:12px">${A.length?A.map(a=>`<div class="item"><div><div class="t">${esc(a.output)}</div><div class="meta">${[a.src+'에서 자동',a.partner||'국외 공동연구자 미입력',a.inst||'기관 미입력',a.year].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div></div>`).join(''):'<div class="empty">논문·특허 탭에서 국제 = 예로 표시된 항목이 아직 없어요.</div>'}</div>`})():''}
    ${editingNew?formHTML(c,{}):''}
    <div class="items">${it.length?it.map(i=>S.editing===i.id?formHTML(c,i.f,i.id):itemHTML(i,c,mode)).join(''):`<div class="empty">아직 입력된 ${c.name} 실적이 없습니다.${canEdit?' <b>+ 추가</b>로 넣어 주세요.':''}</div>`}</div>
    <div class="foot">
      <span class="msg">${it.length}건 · ${done?'<span class="chip ok">확인 완료</span>':'<span class="chip">확인 전</span>'}</span>
      ${mode!=='rev'?`<button class="btn ${done?'':'accent'}" data-act="done">${done?'확인 완료 취소':'이 항목 확인 완료'}</button>`:''}
    </div></div>`;
}

function exHTML(c){return EX[c.key].map(f=>{
  const meta=c.meta(f).filter(Boolean).map(m=>`<span>${esc(m)}</span>`).join('');
  const chips=(c.chips(f)||[]).filter(x=>x&&x[0]!=='fix');
  return `<div class="item ex"><div style="min-width:0"><div class="t">${esc(c.title(f))}</div><div class="meta">${meta}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="chip rep">예시 · 가상 자료</span>${chips.map(x=>`<span class="chip ${x[0]}">${esc(x[1])}</span>`).join('')}</div></div></div>`}).join('')}
function itemHTML(i,c,mode){
  const chips=(c.chips(i.f)||[]).filter(Boolean);
  if(i.pre) chips.unshift(['pre','1차조사']);
  const rv=i.rv.s==='ok'?['ok','검토 확인']:i.rv.s==='fix'?['fix','수정 요청']:['','검토 전'];
  const meta=c.meta(i.f).filter(Boolean).map(m=>`<span class="${/^DOI/.test(m)?'mono':''}">${esc(m)}</span>`).join('');
  return `<div class="item ${i.rv.s==='fix'?'fix':''}">
    <div style="min-width:0"><div class="t">${esc(c.title(i.f)||'(제목 없음)')}</div>
      <div class="meta">${meta}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="chip ${rv[0]}">${rv[1]}</span>${chips.map(x=>`<span class="chip ${x[0]}">${esc(x[1])}</span>`).join('')}</div></div>
    <div class="acts">${mode!=='rev'?`${S.data.uploadUrl?`<button class="btn sm" data-attach="${i.id}">증빙 첨부</button>`:''}<button class="btn sm" data-edit="${i.id}">수정</button><button class="btn ghost sm" data-del="${i.id}">삭제</button>`:''}</div>
    ${(i.files||[]).length?`<div class="files"><span>증빙</span>${i.files.map(x=>`<span><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.n)}</a>${mode!=='rev'?`<button class="btn ghost sm" data-unfile="${i.id}" data-fid="${esc(x.id)}" aria-label="${esc(x.n)} 연결 해제">×</button>`:''}</span>`).join('')}</div>`:''}
    ${i.memo?`<div class="note" style="color:var(--mute)">참고${i.pre&&i.cat==='paper'?' (중간평가 1차조사, 2025년 기준)':''}: ${esc(i.memo)}${i.cat==='paper'?` · JCR 상위 ${i.f.jcr?esc(i.f.jcr)+'%':'% 미입력'}`:''}</div>`:''}
    ${i.rv.s==='fix'&&mode==='prof'?`<div class="note">담당 교수 의견: ${esc(i.rv.c)}</div>`:''}
    ${mode!=='prof'?`<div class="review"><button class="btn sm ok" data-rv="ok" data-id="${i.id}">확인</button><input id="c-${i.id}" placeholder="수정 요청 내용" value="${esc(i.rv.s==='fix'?i.rv.c:'')}"><button class="btn sm warn" data-rv="fix" data-id="${i.id}">수정 요청</button></div>`:''}
  </div>`;
}

function fieldHTML(fd,v){
  const id='f-'+fd.k, req=fd.req?' <span class="req">*</span>':'';
  const lab=`<span>${esc(fd.l)}${req}</span>`;
  if(fd.t==='doi') return `<label class="full">${lab}<div class="row"><input id="${id}" name="${fd.k}" value="${esc(v)}" placeholder="10.xxxx/xxxxx" spellcheck="false"><button class="btn" type="button" data-act="doi">자동 채우기</button></div><span class="help" id="doi-msg">DOI를 넣고 누르면 제목·학술지·게재연월·권호·쪽·저자 수가 채워집니다.</span></label>`;
  if(fd.t==='select') return `<label class="${fd.full?'full':''}">${lab}<select id="${id}" name="${fd.k}"><option value="">선택</option>${v&&!FIELD_OPTS[fd.o].includes(v)?`<option selected>${esc(v)}</option>`:''}${FIELD_OPTS[fd.o].map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  if(fd.t==='yn') return `<label class="${fd.full?'full':''}">${lab}<select id="${id}" name="${fd.k}"><option value="">선택</option>${['예','아니오'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></label>`;
  if(fd.t==='area'){const n=(v||'').replace(/\s/g,'').length;return `<label class="full">${lab}<textarea id="${id}" name="${fd.k}" data-max="${fd.max}">${esc(v)}</textarea><span class="ctr ${n>fd.max?'over':''}" data-ctr="${fd.k}">${n} / ${fd.max}자 (공백 제외)</span></label>`}
  if(fd.t==='multi'){const cur=v||[];return `<div class="full" style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;color:var(--mute);font-weight:500">${lab}</span><div class="checks" id="${id}">${FIELD_OPTS[fd.o].map(o=>`<label><input type="checkbox" name="${fd.k}" value="${esc(o)}" ${cur.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div></div>`}
  if(fd.t==='student'){const names=itemsOf(curPid(),'roster').map(i=>i.f.name);return `<label class="${fd.full?'full':''}">${lab}<select id="${id}" name="${fd.k}"><option value="">${fd.req?'선택':'없음'}</option>${names.map(n=>`<option ${n===v?'selected':''}>${esc(n)}</option>`).join('')}</select><span class="help">${names.length?'지도학생 및 연구원 명단에서 고릅니다':'지도학생 및 연구원 명단 탭에 먼저 학생을 넣어 주세요'}</span></label>`}
  if(fd.t==='years'){const cur=v||{};return `<div class="full" style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;color:var(--mute);font-weight:500">${lab}</span><div class="years">${YEARS.map(y=>`<label>${y}<input type="number" name="${fd.k}.${y}" value="${esc(cur[y]||'')}" inputmode="numeric"></label>`).join('')}</div></div>`}
  const type=fd.t==='date'?'date':fd.t==='number'?'number':'text';
  return `<label class="${fd.full?'full':''}">${lab}<input id="${id}" name="${fd.k}" type="${type}" value="${esc(v)}" placeholder="${esc(fd.ph||'')}">${fd.help?`<span class="help">${esc(fd.help)}</span>`:''}</label>`;
}
function topPick(c){
  if(c.key!=='top') return '';
  const src=itemsOf(curPid()).filter(i=>i.cat==='paper'||i.cat==='ip').sort((a,b)=>(b.f.rep==='예')-(a.f.rep==='예')||String(b.f.ym||b.f.date||'').localeCompare(String(a.f.ym||a.f.date||'')));
  if(!src.length) return '';
  return `<label class="full"><span>다른 실적에서 불러오기</span><select id="top-pick"><option value="">논문·특허 등에서 고르기 (대표 후보로 표시한 것이 위에 있어요)</option>${src.map(i=>`<option value="${i.id}">${i.f.rep==='예'?'[후보] ':''}[${i.cat==='paper'?'논문':esc(i.f.kind||'특허 등')}] ${esc(String(i.f.ym||i.f.date||'').slice(0,7)+' '+String(i.f.title||'').slice(0,80))}</option>`).join('')}</select><span class="help">고르면 종류·연도·업적이 채워지고, 써 둔 우수성이 있으면 설명 칸에 옮겨져요.</span></label>`;
}
function formHTML(c,f,id){
  return `<form class="edit" data-cat="${c.key}" data-id="${id||''}" novalidate>${topPick(c)}${c.fields.map(fd=>fieldHTML(fd,f[fd.k])).join('')}<div class="bar"><span class="msg err" id="form-err"></span><button type="button" class="btn" data-act="cancel">취소</button><button class="btn primary" type="submit">저장</button></div></form>`}

function revHome(){
  if(!S.me.rev) return '<div class="empty">위에서 담당 교수를 고르세요.</div>';
  const mine=S.data.profs.filter(p=>p.rev===S.me.rev);
  return `<div class="head"><h2>담당 교수님 ${mine.length}분</h2><span class="msg">마감 ${esc(S.data.deadline)}</span></div>
  <div class="cards">${mine.map(p=>{const st=stats(p);return `<button class="pcard" data-open="${p.id}">
    <span class="n">${esc(p.name)} <span class="msg">${esc(p.type)}${p.rank?' · '+esc(p.rank):''}</span></span>
    <div class="prog"><i style="width:${st.done/CATS.length*100}%"></i></div>
    <span class="msg">확인 완료 ${st.done}/${CATS.length} · 실적 ${st.n}건 · 최근 수정 ${esc(p.updated||'—')}</span>
    <span class="s"><span class="chip ok">검토 확인 ${st.ok}</span>${st.fix?`<span class="chip fix">수정 요청 ${st.fix}</span>`:''}<span class="chip">검토 전 ${st.n-st.ok-st.fix}</span></span>
  </button>`}).join('')||'<div class="empty">담당 교수님이 없어요.</div>'}</div>`;
}

function adminHome(){

/* ===== 엑셀 ===== */
function rangeYM(){const f=ymOf(S.range.from),t=ymOf(S.range.to);return {f:f||0,t:t||999912}}
function inRange(i){
  if(!S.range.from&&!S.range.to) return true;
  const {f,t}=rangeYM(), inYM=k=>{if(!k)return true;if(k%100===0){const y=k/100;return y>=Math.floor(f/100)&&y<=Math.floor(t/100)}return k>=f&&k<=t};
  if(i.cat==='grant'){const a=ymOf(i.f.start),b=ymOf(i.f.end)||999912;if(!a)return true;return a<=t&&b>=f}
  if(i.cat==='roster'){const a=ymOf(i.f.admit),b=ymOf(i.f.grad);return (!a||a<=t)&&(!b||b>=f)}
  return inYM(dkey(i));
}
function catRows(ck){
  const c=CAT[ck];
  const cols=c.fields.flatMap(f=>f.t==='years'?YEARS.map(y=>({l:y+' 입금액',get:x=>(x[f.k]||{})[y]||''})):[{l:f.l,get:x=>Array.isArray(x[f.k])?x[f.k].join(', '):(x[f.k]??'')}]);
  const head=['교수','기초/임상',...cols.map(x=>x.l),'1차조사','참고','검토','검토 의견','증빙'];
  const rows=S.data.items.filter(i=>i.cat===ck&&inRange(i)).map(i=>{const p=prof(i.prof)||{};return [p.name,p.type,...cols.map(x=>x.get(i.f)),i.pre?'예':'',i.memo||'',{ok:'확인',fix:'수정 요청',none:'검토 전'}[i.rv.s],i.rv.c||'',(i.files||[]).map(x=>x.url).join(' ')]})
    .sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'ko'));
  if(ck==='collab') S.data.profs.forEach(p=>intlAuto(p.id).filter(a=>inRange({cat:'collab',f:{year:a.year}})).forEach(a=>rows.push([p.name,p.type,a.output,a.partner,a.inst,a.year,'',a.src+'에서 자동','','',''])));
  return [head,...rows];
}
function exportXlsx(){
  if(!window.XLSX){toast('엑셀 도구를 불러오지 못했어요');return}
  const wb=XLSX.utils.book_new();
  const ph=[['교수','기초/임상','직급','연구자등록번호','국내 최초 임용일','기금교수','담당 교수','확인 완료','실적 건수','수정 요청','최근 수정']]
    .concat(S.data.profs.map(p=>{const st=stats(p);return [p.name,p.type,p.rank||'',p.rid||'',p.hired||'',/^기금교수/.test(p.rank||'')?'예':(p.rank?'아니오':''),revName(p.rev),st.done+'/'+CATS.length,st.n,st.fix,p.updated||'']}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ph),'교수 현황');
  CATS.forEach(c=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(catRows(c.key)),c.name.replace(/[\\/?*\[\]:]/g,'·').slice(0,31)));
  const d=new Date(), rg=(S.range.from||S.range.to)?`_${(S.range.from||'처음').replace('-','')}-${(S.range.to||'현재').replace('-','')}`:'';XLSX.writeFile(wb,`BK21_실적조사${rg}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.xlsx`);
}

/* ===== 개인 링크 ===== */
const linkOf=k=>BASE_URL+'?k='+k;
function roleText(l){const r=[];if(l.admin)r.push('관리자');if(l.prof)r.push('교수'+((prof(l.prof)||{}).name&&(prof(l.prof).name!==l.name)?' ('+prof(l.prof).name+' 대리)':''));if(l.rev)r.push('담당 교수');return r.join(' · ')||'—'}
function newToken(){const a=new Uint8Array(16);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function loadLinks(){try{const q=await db.collection('keys').get();S.links=q.docs.map(docOf).sort((a,b)=>a.name.localeCompare(b.name,'ko'))}catch(e){fail(e)}render()}
async function newKey(){
  const name=$('#nk-name').value.trim(), r=$('#nk-role').value; if(!name){toast('이름을 넣어 주세요');$('#nk-name').focus();return}
  const t=newToken(), x=r==='admin'?{name,admin:true}:{name,prof:r};
  try{await db.doc('keys/'+t).set(x);await loadLinks();toast('링크를 만들었어요')}catch(e){fail(e)}
}

/* ===== 교수 추가·삭제 ===== */
async function addProf(){
  const name=$('#np-name').value.trim(); if(!name){toast('이름을 넣어 주세요');$('#np-name').focus();return}
  if(S.data.profs.some(p=>p.name===name)&&!confirm(name+' 교수님이 이미 있어요. 그래도 추가할까요?')) return;
  const ref=db.collection('profs').doc(), t=newToken();
  const p={name,type:$('#np-type').value,rank:$('#np-rank').value,rid:$('#np-rid').value.trim(),hired:'',fund:'',rev:$('#np-rev').value,done:{},updated:''};
  try{const b=db.batch();b.set(ref,p);b.set(db.doc('keys/'+t),{name,prof:ref.id});await b.commit();
    putProf(Object.assign({id:ref.id},p)); if(S.links) await loadLinks();
    render(); toast(name+' 교수님을 추가했어요. 개인 링크는 "링크 목록 보기"에 있어요');
  }catch(e){fail(e)}
}
async function delProf(pid){
  const p=prof(pid); if(!p) return; const n=itemsOf(pid).length;
  if(!confirm(`${p.name} 교수님을 삭제할까요?\n입력된 실적 ${n}건과 개인 링크도 함께 지워지고, 되돌릴 수 없어요.`)) return;
  try{
    const [it,ks]=await Promise.all([db.collection('items').where('prof','==',pid).get(),db.collection('keys').where('prof','==',pid).get()]);
    // 관리자·담당 교수 링크는 지우지 않고 교수 연결만 뗀다
    const ops=[...it.docs.map(d=>[d.ref]),...ks.docs.map(d=>{const x=d.data();return x.admin||x.rev?[d.ref,{prof:firebase.firestore.FieldValue.delete()}]:[d.ref]}),[db.doc('profs/'+pid)]];
    for(let k=0;k<ops.length;k+=400){const b=db.batch();ops.slice(k,k+400).forEach(([r,u])=>u?b.update(r,u):b.delete(r));await b.commit()}
    S.data.profs=S.data.profs.filter(x=>x.id!==pid); S.data.items=S.data.items.filter(x=>x.prof!==pid);
    if(S.links) await loadLinks();
    render(); toast(p.name+' 교수님을 삭제했어요');
  }catch(e){fail(e)}
}

/* ===== 담당 교수 권한 ===== */
async function grantRev(){
  const pid=$('#gr-prof').value, p=prof(pid); if(!p){toast('교수님을 골라 주세요');return}
  const n=Math.max(-1,...S.data.reviewers.map(r=>+String(r.id).replace(/\D/g,'')||0))+1, rid='r'+n;
  try{
    const ks=(await db.collection('keys').where('prof','==',pid).get()).docs.filter(d=>d.data().name===p.name);
    const b=db.batch(); b.set(db.doc('reviewers/'+rid),{name:p.name,major:''});
    if(ks.length) ks.forEach(d=>b.update(d.ref,{rev:rid})); else b.set(db.doc('keys/'+newToken()),{name:p.name,prof:pid,rev:rid});
    await b.commit(); S.data.reviewers.push({id:rid,name:p.name,major:''}); if(S.links) await loadLinks();
    render(); toast(p.name+' 교수님께 담당 교수 권한을 드렸어요');
  }catch(e){fail(e)}
}
async function revokeRev(rid){
  const r=S.data.reviewers.find(x=>x.id===rid); if(!r) return;
  const n=S.data.profs.filter(p=>p.rev===rid).length;

async function bulkAssign(){
  const msg=$('#ba-msg'), lines=$('#ba-text').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const upd=[], miss=[], badRev=[], seen=new Set();
  lines.forEach(l=>{const m=l.match(/^([^:：]+)[:：](.*)$/);if(!m)return;
    const rn=m[1].replace(/\(.*?\)/g,'').trim(), r=S.data.reviewers.find(x=>x.name===rn); if(!r){badRev.push(rn);return}
    m[2].split(/[,，、\s]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{const p=S.data.profs.find(x=>x.name===n);if(!p){miss.push(n);return}seen.add(p.id);if(p.rev!==r.id)upd.push([p,r])})});
  if(badRev.length){msg.textContent='담당 교수 목록에 없는 이름: '+badRev.join(', ')+' — 먼저 권한을 주세요';msg.className='msg err';return}

  try{const b=db.batch();upd.forEach(([p,r])=>b.update(db.doc('profs/'+p.id),{rev:r.id}));await b.commit();upd.forEach(([p,r])=>p.rev=r.id);
    const rest=S.data.profs.filter(p=>!seen.has(p.id)&&!S.data.reviewers.some(r=>r.name===p.name)).map(p=>p.name);
    render(); const m2=$('#ba-msg'); m2.closest('details').open=true;
    m2.textContent=`${upd.length}명 바꿨어요.`+(miss.length?` 명단에 없는 이름: ${miss.join(', ')}.`:'')+(rest.length?` 표에 없어 그대로 둔 교수: ${rest.join(', ')}`:'');
  }catch(e){fail(e)}
}

/* ===== JCR (IF · 상위 %) ===== */
const jnorm=s=>String(s||'').toUpperCase().replace(/&/g,'AND').replace(/[^A-Z0-9]/g,'');
const inorm=s=>String(s||'').toUpperCase().replace(/[^0-9X]/g,'');
function jbucket(k){let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;return h%32}
async function jcrDoc(id){if(!(id in S.jcrCache)){const d=await db.doc('jcr/'+id).get();S.jcrCache[id]=d.exists?(d.data().e||{}):{}}return S.jcrCache[id]}
// 출판 당시 JCR 연도: JCR은 매년 6월 말에 전년도 값이 나오므로 7월 이후 출판은 전년도, 1–6월은 전전년도. 월이 없으면 전년도.
function pubJcrYear(ym){const m=String(ym||'').match(/(\d{4})(?:\D+(\d{1,2}))?/);if(!m)return 0;const y=+m[1],mo=+m[2]||0;return mo&&mo<7?y-2:y-1}
async function jcrExact(issns,name,year){
  const keys=[...(issns||[]).map(x=>'I'+inorm(x)).filter(k=>k.length===9),...(name?['N'+jnorm(name)]:[])];
  if(!year||!keys.length||!S.data.jcrYears.map(Number).includes(+year)) return null;
  for(const k of keys){const e=(await jcrDoc(year+'_'+jbucket(k)))[k];if(e)return {if:e[0],pct:e[1],year:+year}}
  return null;
}
async function jcrLookup(issns,name,year){
  const keys=[...(issns||[]).map(x=>'I'+inorm(x)).filter(k=>k.length===9),...(name?['N'+jnorm(name)]:[])];
  const ys=S.data.jcrYears.map(Number).sort((a,b)=>b-a); if(!keys.length||!ys.length) return null;
  const y0=Number(year)||ys[0], order=[...ys.filter(y=>y<=y0),...ys.filter(y=>y>y0).reverse()];
  for(const y of order) for(const k of keys){const e=(await jcrDoc(y+'_'+jbucket(k)))[k];if(e)return {if:e[0],pct:e[1],year:y}}
  return null;
}
// 표준 형식만 받는다: 연도, 저널명, ISSN, eISSN, IF, 상위%, 분야 (JCR/jcr_convert.py 로 변환)
const JCR_STD=['연도','저널명','ISSN','eISSN','IF','상위%','분야'];
function jcrParse(rows,fname){
  const H=(rows[0]||[]).map(c=>String(c||'').replace(/^﻿/,'').trim()), ix=Object.fromEntries(JCR_STD.map(k=>[k,H.indexOf(k)]));
  const miss=JCR_STD.filter(k=>ix[k]<0); if(miss.length) throw new Error(`${fname}: 표준 형식이 아니에요 (없는 열: ${miss.join(', ')}). jcr_convert.py로 먼저 변환해 주세요`);
  const num=v=>{const t=String(v??'').trim();if(!t)return null;const n=parseFloat(t);return isNaN(n)?null:n};
  const byYear={};let n=0,withPct=0;
  for(const r of rows.slice(1)){ if(!r) continue;
    const y=parseInt(r[ix['연도']]), jif=num(r[ix.IF]); if(!y||jif===null) continue;
    const pct=num(r[ix['상위%']]), v=[jif,pct===null?null:Math.round(pct*100)/100], out=byYear[y]=byYear[y]||{}; n++; if(pct!==null)withPct++;
    ['I'+inorm(r[ix.ISSN]),'I'+inorm(r[ix.eISSN]),'N'+jnorm(r[ix['저널명']])].filter(k=>k.length>2&&!(k[0]==='I'&&k.length!==9)).forEach(k=>{const o=out[k];if(!o||(v[1]!==null&&(o[1]===null||v[1]<o[1])))out[k]=v})}
  if(!n) throw new Error(fname+': 읽을 행이 없어요');
  return {byYear,n,withPct};
}
async function jcrUpload(){
  const files=[...$('#jcr-file').files], msg=$('#jcr-msg'); if(!files.length){msg.textContent='파일을 먼저 고르세요.';return}
  try{
    const all={}, notes=[];
    for(const f of files){msg.textContent='읽는 중… '+f.name;
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const r=jcrParse(rows,f.name);
      Object.entries(r.byYear).forEach(([y,out])=>{const A=all[y]=all[y]||{};Object.entries(out).forEach(([k,v])=>{const o=A[k];if(!o||(v[1]!==null&&(o[1]===null||v[1]<o[1])))A[k]=v})});
      notes.push(`${f.name}: JCR ${Object.keys(r.byYear).join('·')}년 · 저널 ${r.n}개 · 상위% 있음 ${r.withPct}개`);
    }
    const ys=Object.keys(all).sort(), n=ys.map(y=>`${y}년 ${Object.keys(all[y]).filter(k=>k[0]==='N').length}개`).join(', ');
    if(!confirm(`${n}\n\n${notes.slice(0,12).join('\n')}${notes.length>12?`\n… 외 ${notes.length-12}개 파일`:''}\n\n저장할까요?`)){msg.textContent='';return}
    for(const year of ys){msg.textContent=`저장 중… ${year}년`;
      const bk={};Object.entries(all[year]).forEach(([k,v])=>{(bk[jbucket(k)]=bk[jbucket(k)]||{})[k]=v});
      // 한 번에 묶어 저장하면 'Transaction too big' → 문서(32개 중 1개)마다 따로 저장
      const ids=Object.keys(bk);let done=0;
      for(const i of ids){const id=year+'_'+i;delete S.jcrCache[id];const cur=await jcrDoc(id);const m=Object.assign({},cur);
        Object.entries(bk[i]).forEach(([k,v])=>{const o=m[k];if(!o||(v[1]!==null&&(o[1]===null||v[1]<o[1]))||(o[1]===null&&v[1]===null))m[k]=v});
        await db.doc('jcr/'+id).set({e:m});S.jcrCache[id]=m;msg.textContent=`저장 중… ${year}년 ${++done} / ${ids.length}`}
    }
    const yall=Array.from(new Set([...S.data.jcrYears.map(String),...ys]));
    await db.doc('config/app').set({jcrYears:yall},{merge:true}); S.data.jcrYears=yall;
    render(); $('#jcr-msg').textContent=`저장했어요: ${n}`;
  }catch(e){console.error(e);msg.textContent='올리지 못했어요: '+(e.message||e)}
}
async function jcrFill(){
  const msg=$('#jcr-msg'); if(!S.data.jcrYears.length){msg.textContent='먼저 JCR 자료를 올려 주세요.';return}
  const base=Number(S.data.jcrBase)||0;
  const todo=S.data.items.filter(i=>i.cat==='paper'&&i.f.journal);
  msg.textContent=`찾는 중… 0 / ${todo.length}`; const ups=[]; let k=0, nPub=0, nCur=0;
  for(const i of todo){k++;if(k%20===0)msg.textContent=`찾는 중… ${k} / ${todo.length}`;
    const f=Object.assign({},i.f);
    if(!f.if||!f.jcr){const r=await jcrExact([],f.journal,pubJcrYear(f.ym));
      if(r){if(!f.if&&r.if!=null)f.if=String(r.if);if(!f.jcr&&r.pct!=null)f.jcr=String(r.pct);nPub++}
}
    if(base){const r=await jcrExact([],f.journal,base);const nv=r?[r.if!=null?String(r.if):'',r.pct!=null?String(r.pct):'']:['',''];
      if(nv[0]!==(f.if_cur||'')||nv[1]!==(f.jcr_cur||'')){f.if_cur=nv[0];f.jcr_cur=nv[1]}if(r)nCur++}
    if(JSON.stringify(f)!==JSON.stringify(i.f)) ups.push([i,f])}
  if(!ups.length){msg.textContent='바뀌는 논문이 없어요.';return}
  if(!confirm(`논문 ${ups.length}건을 고칠까요?\n· 출판 당시 IF·상위 %: 빈 칸만 채움 (JCR ${nPub}건)\n· 기준 연도${base?' '+base:''} IF·상위 %: ${base?`전부 다시 계산 (찾음 ${nCur}건)`:'기준 연도가 정해지지 않아 건너뜀'}`)){msg.textContent='';return}
  try{for(let a=0;a<ups.length;a+=400){const b=db.batch();ups.slice(a,a+400).forEach(([i,f])=>b.update(db.doc('items/'+i.id),{f}));await b.commit()}
    ups.forEach(([i,f])=>i.f=f); msg.textContent=`${ups.length}건 고쳤어요.`}catch(e){fail(e)}
}

    const d=JSON.parse(await f.text());

    const keys=(pid,v)=>{const s=String(v||''),h=s.replace(/[^가-힣]/g,''),l=s.replace(/[^A-Za-z]/g,'').toLowerCase();return [h&&pid+'|h|'+h,l&&pid+'|l|'+l].filter(Boolean)};

  if(act==='jcrup') await jcrUpload();
  if(act==='jcrfill') await jcrFill();
  if(act==='upurl'){const v=$('#upurl').value.trim();if(v&&!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){toast('…/exec 로 끝나는 Apps Script 주소를 넣어 주세요');return}
    try{await db.doc('config/app').set({uploadUrl:v},{merge:true});S.data.uploadUrl=v;toast(v?'업로드 주소를 저장했어요':'업로드를 껐어요')}catch(er){fail(er)}}
  if(act==='copylinks'){const t=S.links.map(l=>l.name+'\t'+linkOf(l.id)).join('\n');try{await navigator.clipboard.writeText(t);toast('복사했어요. 엑셀에 붙여 넣으세요')}catch(_){toast('복사하지 못했어요. 링크 칸을 직접 선택해 주세요')}}
  if(act==='deadline'){const v=$('#deadline').value.trim();try{await db.doc('config/app').set({deadline:v},{merge:true});S.data.deadline=v;toast('마감일을 저장했어요')}catch(er){fail(er)}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='me-rev'){S.me.rev=t.value||null;S.open=null;await refresh();return}
  if(t.id==='flt'){S.filterFix=t.checked;render();return}
  if(t.id==='jcr-base'){try{await db.doc('config/app').set({jcrBase:t.value},{merge:true});S.data.jcrBase=t.value;toast(t.value?`기준 연도를 ${t.value} JCR로 정했어요. "논문 IF·JCR 채우기"를 누르면 반영돼요`:'기준 연도를 지웠어요',4000)}catch(er){fail(er)}return}
  if(t.id==='filepick'){const f=t.files[0];if(f&&S.attachFor)await uploadFile(S.attachFor,f);return}
  if(t.id==='rg-from'||t.id==='rg-to'){S.range[t.id==='rg-from'?'from':'to']=t.value;S.tsv='';return}
  if(t.id==='top-pick'){const i=S.data.items.find(x=>x.id===t.value);if(!i)return;const f=i.f,el=t.closest('form').elements;
    const type=i.cat==='paper'?'논문':({등록특허:'특허',기술이전:'기술이전',저서:'저서'}[f.kind]||'기타');
    const out=i.cat==='paper'?[f.title,f.journal&&(f.journal+(f.ym?' ('+f.ym+')':'')),f.vol,f.pages,f.doi&&('DOI '+f.doi)].filter(Boolean).join('. '):[f.kind,f.title,f.country,f.number].filter(Boolean).join(' · ');
    el.ttype.value=type; el.year.value=String(f.ym||f.date||'').slice(0,4); el.output.value=out;
    if(f.merit&&!el.desc.value.trim()){el.desc.value=f.merit;el.desc.dispatchEvent(new Event('input',{bubbles:true}))}
    return}
  if(t.id==='promo-from'){const pid=curPid();S.promoFrom[pid]=t.value;try{localStorage.setItem('promoFrom:'+pid,t.value)}catch(er){} render();return}
  if(t.dataset.pf){try{await touchProf(curPid(),{[t.dataset.pf]:t.value});toast('저장했어요')}catch(er){fail(er)} render();return}
  if(t.dataset.assign){const r=S.data.reviewers.find(x=>x.id===t.value);try{await db.doc('profs/'+t.dataset.assign).update({rev:t.value});const p=prof(t.dataset.assign);p.rev=t.value;toast('담당 교수를 바꿨어요')}catch(er){fail(er)}return}
  if(t.name&&t.closest('.checks')){const box=t.closest('.checks');const fd=CAT[box.closest('form').dataset.cat].fields.find(f=>f.k===t.name);
    if(fd.max&&box.querySelectorAll('input:checked').length>fd.max){t.checked=false;toast(`최대 ${fd.max}개까지 고를 수 있어요`)}}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.max){const n=e.target.value.replace(/\s/g,'').length,m=+e.target.dataset.max;const c=document.querySelector(`[data-ctr="${e.target.name}"]`);c.textContent=`${n} / ${m}자 (공백 제외)`;c.classList.toggle('over',n>m)}
});
document.addEventListener('submit',async e=>{
  e.preventDefault(); const form=e.target;
  const c=CAT[form.dataset.cat], f={}, miss=[];
  c.fields.forEach(fd=>{
    if(fd.t==='multi') f[fd.k]=[...form.querySelectorAll(`input[name="${fd.k}"]:checked`)].map(x=>x.value);
    else if(fd.t==='years'){f[fd.k]={};YEARS.forEach(y=>{const x=form.elements[fd.k+'.'+y].value.trim();if(x)f[fd.k][y]=x})}
    else f[fd.k]=(form.elements[fd.k].value||'').trim();
    if(fd.req&&fd.t!=='years'&&(!f[fd.k]||(Array.isArray(f[fd.k])&&!f[fd.k].length))) miss.push(fd.l);
    if(fd.t==='area'&&(f[fd.k]||'').replace(/\s/g,'').length>fd.max) miss.push(fd.l+' 글자 수');
  });
  if(miss.length){$('#form-err').textContent='확인 필요: '+miss.join(', ');return}
  const pid=curPid(); const btn=form.querySelector('[type=submit]'); btn.disabled=true;
  try{
    if(form.dataset.id){const it=S.data.items.find(x=>x.id===form.dataset.id);const upd={f,updatedAt:TS()};if(it.rv.s==='fix')upd.rv={s:'none',c:''};
      await db.doc('items/'+it.id).update(upd);it.f=f;if(upd.rv)it.rv=upd.rv}
    else{const x={prof:pid,cat:c.key,pre:0,f,memo:'',rv:{s:'none',c:''},updatedAt:TS()};const ref=await db.collection('items').add(x);S.data.items.push(Object.assign({id:ref.id},x))}
    await touchProf(pid,{['done.'+c.key]:0}); S.editing=null; toast('저장했어요');
  }catch(er){fail(er);btn.disabled=false;return}
  render();
});

async function doiFill(){
  const inp=$('#f-doi'), msg=$('#doi-msg'); const doi=inp.value.trim().replace(/^https?:\/\/(dx\.)?doi\.org\//,'').replace(/^doi:\s*/i,'');
  if(!doi){msg.textContent='DOI를 먼저 넣어 주세요.';msg.className='help msg err';return}
  const set=(k,v)=>{const el=document.querySelector(`form.edit [name="${k}"]`);if(el&&v)el.value=v};
  msg.textContent='조회 중…';msg.className='help';
  try{
    const r=await fetch('https://api.crossref.org/works/'+encodeURIComponent(doi));if(!r.ok)throw 0;
    const m=(await r.json()).message;const dp=(m.issued&&m.issued['date-parts']&&m.issued['date-parts'][0])||[];
    inp.value=doi;set('title',(m.title||[])[0]);set('journal',(m['container-title']||[])[0]);set('ym',dp[0]?dp[0]+'.'+String(dp[1]||1).padStart(2,'0'):'');
    set('vol',m.volume?(m.volume+(m.issue?'('+m.issue+')':'')):'');set('pages',m.page||m['article-number']||'');set('nauth',m.author?String(m.author.length):'');
    let extra='';
    try{const ym=dp[0]?dp[0]+'.'+(dp[1]||''):'', py=pubJcrYear(ym), base=Number(S.data.jcrBase)||0, iss=m.ISSN||[], jn=(m['container-title']||[])[0];
      const j=await jcrExact(iss,jn,py), c=base?await jcrExact(iss,jn,base):null;
      set('if',j&&j.if!=null?String(j.if):'');set('jcr',j&&j.pct!=null?String(j.pct):'');set('if_cur',c&&c.if!=null?String(c.if):'');set('jcr_cur',c&&c.pct!=null?String(c.pct):'');
      if(S.data.jcrYears.length) extra=(j?` 출판 당시 = ${py} JCR.`:` ${py} JCR에 이 저널이 없어 출판 당시 IF는 직접 넣어 주세요.`)+(base?(c?` 기준 = ${base} JCR.`:''):'');}catch(_){}
    msg.textContent='채웠어요. 저자 역할을 골라 주세요.'+extra;
  }catch(_){msg.textContent='자동 조회가 안 됐어요. DOI를 확인하거나 직접 입력해 주세요.';msg.className='help msg err'}
}

/* ===== 시작 ===== */
S.key=(new URLSearchParams(location.search).get('k')||'').trim();
if(!S.key) showNoKey();
else auth.signInAnonymously().then(c=>boot(c.user)).catch(e=>{console.error(e);showNoKey({text:'접속하지 못했어요. 잠시 뒤 다시 열어 주세요.',err:1})});

</script>
